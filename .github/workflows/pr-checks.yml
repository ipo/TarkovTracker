name: PR Checks
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'app/locales/cs.json'
      - 'app/locales/de.json'
      - 'app/locales/es.json'
      - 'app/locales/fr.json'
      - 'app/locales/it.json'
      - 'app/locales/ko.json'
      - 'app/locales/pl.json'
      - 'app/locales/pt.json'
      - 'app/locales/ru.json'
      - 'app/locales/uk.json'
      - 'app/locales/zh.json'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  pr-meta:
    name: PR Meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Auto-label PR
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Calculate and apply size label
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const additions = files.reduce((sum, file) => sum + file.additions, 0);
            const deletions = files.reduce((sum, file) => sum + file.deletions, 0);
            const total = additions + deletions;
            let label = 'size/S';
            if (total > 1000) label = 'size/XXL';
            else if (total > 500) label = 'size/XL';
            else if (total > 250) label = 'size/L';
            else if (total > 100) label = 'size/M';
            const { data: existingLabels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const sizeLabels = existingLabels
              .map(l => l.name)
              .filter(name => name.startsWith('size/'));
            if (sizeLabels.length === 1 && sizeLabels[0] === label) {
              console.log(`Size label ${label} already correct, skipping`);
              return;
            }
            for (const name of sizeLabels) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [label],
            });
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.14.0 --activate
      - name: Setup pnpm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate commit messages
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
